version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAX_FILE_SIZE=100mb
      - NODE_ENV=production
    volumes:
      - uploads:/app/backend/uploads
      - frames:/app/backend/frames
      - output:/app/backend/output
    restart: unless-stopped

volumes:
  uploads:
  frames:
  output:
